services:
  backend:
    build: ./backend
    environment:
      # 容器内路径；换挂载位置时一并改这个变量
      DB_PATH: /data/calendar.db
    volumes:
      # 改假日：编辑宿主机 calendar.db 的 holiday_days，并更新 holiday_meta.updated；无需重建镜像
      - ${CALENDAR_DB:-./backend/data/calendar.db}:/data/calendar.db:ro
    expose:
      - "9000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
