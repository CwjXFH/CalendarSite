services:
  backend:
    build: ./backend
    environment:
      DB_PATH: /data/calendar.db
      OPS_TOKEN: ${OPS_TOKEN:-}
    volumes:
      - /root/calendar_data:/data
    expose:
      - "9000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
