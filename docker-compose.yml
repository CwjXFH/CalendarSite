services:
  backend:
    build: ./backend
    volumes:
      - calendar-data:/src/data
    expose:
      - "9000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  calendar-data:
