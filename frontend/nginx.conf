limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name www.wannianli.site wannianli.site;
    return 301 https://wannianli.site$request_uri;
}

server {
    listen 443 ssl;
    server_name www.wannianli.site;

    ssl_certificate     /etc/nginx/ssl/wannianli.site_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/wannianli.site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://wannianli.site$request_uri;
}

server {
    listen 443 ssl;
    server_name wannianli.site;

    ssl_certificate     /etc/nginx/ssl/wannianli.site_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/wannianli.site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types application/json text/plain text/css text/html text/xml application/xml application/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    root /usr/share/nginx/html;
    index index.html;

    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /manifest.json {
        try_files /manifest.json =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sw.js {
        try_files /sw.js =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location ~ ^/sitemap(-[a-z]+)?\.xml$ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:9000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /seo.css {
        try_files /seo.css =404;
        default_type text/css;
        add_header Cache-Control "public, max-age=600";
    }

    location = /logo.svg {
        try_files /logo.svg =404;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /gift.svg {
        try_files /gift.svg =404;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /leaf.svg {
        try_files /leaf.svg =404;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /assets/logo.svg {
        try_files /logo.svg =404;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
    }

    location /y/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jieqi/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fangjia/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
