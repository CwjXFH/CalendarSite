<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/seo.css" />
    <meta name="theme-color" content="#c43c3c" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="{{ site_name }}" />
    {% if faq_json %}
    <script type="application/ld+json">{{ faq_json | safe }}</script>
    {% endif %}
    <script>
      var _hmt = _hmt || []
      ;(function () {
        if (location.hostname !== "wannianli.site") {
          return
        }
        var hm = document.createElement("script")
        hm.src = "https://hm.baidu.com/hm.js?4ea5f209caf0c09f95e27224e4222ea3"
        var s = document.getElementsByTagName("script")[0]
        s.parentNode.insertBefore(hm, s)
      })()
    </script>
  </head>
  <body>
    <div class="page">
      <header class="page__header">
        <div class="page__brand">
          <a class="page__title" href="/">万年历</a>
        </div>
        <nav class="page__seo-nav" aria-label="专题">
          <a href="{{ nav_year }}">{{ year }}年历</a>
          <a href="{{ nav_fangjia }}">放假安排</a>
          <a href="{{ nav_jieqi }}">二十四节气</a>
        </nav>
      </header>
      <main>
        <h1 class="page__heading">{{ heading }}</h1>
        {% block content %}{% endblock %}
      </main>
      <footer class="page__footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">沪ICP备2026041562号-1</a>
        <a class="page__footer-mps" href="https://beian.mps.gov.cn/#/query/webSearch?code=31011302009659" target="_blank" rel="noreferrer">
          <img src="/备案图标.png" alt="" />
          沪公网安备31011302009659号
        </a>
      </footer>
    </div>
  </body>
</html>
