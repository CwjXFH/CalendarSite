<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      @media (max-width: 840px) {
        .nav-holiday,
        .nav-jieqi { font-size: 0; line-height: 0; }
        .nav-holiday::after { content: "放假"; font-size: 14px; line-height: 1.4; }
        .nav-jieqi::after { content: "节气"; font-size: 14px; line-height: 1.4; }
      }
    </style>
    <link rel="stylesheet" href="{{ seo_css_href }}" />
    <meta name="theme-color" content="#c47878" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="{{ site_name }}" />
    {% if faq_json %}
    <script type="application/ld+json">{{ faq_json | safe }}</script>
    {% endif %}
    {% if breadcrumb_json %}
    <script type="application/ld+json">{{ breadcrumb_json | safe }}</script>
    {% endif %}
    <script>
      var _hmt = _hmt || []
      ;(function () {
        if (location.hostname !== "wannianli.site") {
          return
        }
        var hm = document.createElement("script")
        hm.src = "https://hm.baidu.com/hm.js?4ea5f209caf0c09f95e27224e4222ea3"
        var s = document.getElementsByTagName("script")[0]
        s.parentNode.insertBefore(hm, s)
      })()
    </script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="site-header__row">
          <a class="site-brand" href="/">
            <img class="site-logo" src="/logo.svg" width="40" height="40" alt="" />
            <span class="site-name">万年历</span>
          </a>
          <form class="site-search" action="/" method="get" role="search">
            <span class="site-search__icon" aria-hidden="true"></span>
            <input type="search" name="q" placeholder="搜索日期/节日/节气" aria-label="搜索日期、节日或节气" />
          </form>
        </div>
        <nav class="site-nav" aria-label="站点">
          <a href="{{ nav_home }}"{% if nav_active == "month" %} class="is-active"{% endif %}>月历</a>
          <a href="{{ nav_year }}"{% if nav_active == "year" %} class="is-active"{% endif %}>年历</a>
          <a class="nav-holiday{% if nav_active == "fangjia" %} is-active{% endif %}" href="{{ nav_fangjia }}">放假安排</a>
          <a class="nav-jieqi{% if nav_active == "jieqi" %} is-active{% endif %}" href="{{ nav_jieqi }}">二十四节气</a>
        </nav>
      </header>
      <main class="page-main">
        <h1 class="page__heading{% if nav_active == 'year' %} page__heading--year{% endif %}">{{ heading }}</h1>
        {% block content %}{% endblock %}
      </main>
      <footer class="page__footer">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">沪ICP备2026041562号-1</a>
        <a class="page__footer-mps" href="https://beian.mps.gov.cn/#/query/webSearch?code=31011302009659" target="_blank" rel="noreferrer">
          <img src="/备案图标.png" alt="" />
          沪公网安备31011302009659号
        </a>
      </footer>
    </div>
  </body>
</html>
