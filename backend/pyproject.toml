[project]
name = "calendarsite-backend"
version = "0.1.0"
description = "Calendar site API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "slowapi>=0.1.9",
    "lunar-python>=1.4.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
